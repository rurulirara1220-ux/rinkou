<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>燐光 | Portfolio</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "Helvetica Neue", sans-serif;
      background: #f5f5f5;
      color: #222;
      line-height: 1.6;
    }

    /* 年齢確認画面 */
    #age-gate {
      position: fixed;
      inset: 0;
      background: white;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      padding: 20px;
    }

    .gate-box {
      width: 100%;
      max-width: 400px;
      text-align: center;
      border: 1px solid #ddd;
      padding: 40px 30px;
      border-radius: 12px;
      background: #fff;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    }

    .gate-box h1 {
      margin-bottom: 10px;
      font-size: 28px;
    }

    .gate-box p {
      margin-bottom: 20px;
      color: #666;
    }

    input[type="date"] {
      width: 100%;
      padding: 12px;
      margin-bottom: 15px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 12px;
      border: none;
      background: #222;
      color: white;
      font-size: 16px;
      border-radius: 8px;
      cursor: pointer;
      transition: 0.2s;
    }

    button:hover {
      background: #444;
    }

    #error-message {
      margin-top: 15px;
      color: red;
      font-size: 14px;
    }

    /* メインサイト */
    #main-content {
      display: none;
    }

    header {
      padding: 80px 20px;
      text-align: center;
      background: white;
    }

    header h1 {
      font-size: 48px;
      margin-bottom: 10px;
    }

    header p {
      color: #777;
    }

    .works {
      max-width: 1000px;
      margin: 60px auto;
      padding: 0 20px;
    }

    .works h2 {
      margin-bottom: 30px;
      font-size: 32px;
      text-align: center;
    }

    .work-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
    }

    .work-card {
      background: white;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 3px 10px rgba(0,0,0,0.08);
      transition: 0.2s;
    }

    .work-card:hover {
      transform: translateY(-5px);
    }

    .work-image {
      height: 180px;
      background: #ddd;
    }

    .work-content {
      padding: 20px;
    }

    .work-content h3 {
      margin-bottom: 10px;
    }

    footer {
      text-align: center;
      padding: 40px 20px;
      color: #777;
      font-size: 14px;
    }

    @media (max-width: 600px) {
      header h1 {
        font-size: 36px;
      }

      .works h2 {
        font-size: 26px;
      }
    }
  </style>
</head>

<body>

  <!-- 年齢確認 -->
  <div id="age-gate">
    <div class="gate-box">
      <h1>燐光</h1>
      <p>生年月日を入力してください</p>

      <input type="date" id="birthdate" />

      <button onclick="checkAge()">ENTER</button>

      <div id="error-message"></div>
    </div>
  </div>

  <!-- メインコンテンツ -->
  <div id="main-content">

    <header>
      <h1>燐光</h1>
      <p>Portfolio Site</p>
    </header>

    <section class="works">
      <h2>作品紹介</h2>

      <div class="work-grid">

        <div class="work-card">
          <div class="work-image"></div>
          <div class="work-content">
           <h3>
           <a href= "https://www.pixiv.net/novel/series/14225237" >ペットショップおいなり
           </a>
　　       </h3>
            <p>
              不思議なペットショップで人外な彼らに出会うお話
            </p>
          </div>
        </div>

        <div class="work-card">
          <div class="work-image"></div>
          <div class="work-content">
           <h3>
　　       <a href= "https://www.pixiv.net/novel/series/12730573" >HQファンタジー
           </a>
　　　     </h3>
            <p>
              ファンタジーな世界の彼らのお話
            </p>
          </div>
        </div>

        <div class="work-card">
          <div class="work-image"></div>
          <div class="work-content">
           <h3>
　　　     <a href= "https://www.pixiv.net/novel/series/15029888" >桎梏
　　　     </a>
　         </h3>
            <p>
              人間が絶滅危惧種の世界で人外な彼らに飼われるお話
            </p>
          </div>
        </div>

      </div>
    </section>

    <footer>
      © 2026 燐光
    </footer>

  </div>

  <script>
    function checkAge() {
      const birthdate = document.getElementById("birthdate").value;
      const errorMessage = document.getElementById("error-message");

      if (!birthdate) {
        errorMessage.textContent = "生年月日を入力してください";
        return;
      }

      const today = new Date();
      const birth = new Date(birthdate);

      let age = today.getFullYear() - birth.getFullYear();

      const monthDiff = today.getMonth() - birth.getMonth();

      if (
        monthDiff < 0 ||
        (monthDiff === 0 && today.getDate() < birth.getDate())
      ) {
        age--;
      }

      if (age < 18) {
        errorMessage.textContent =
          "18歳未満の方は閲覧できません";
        return;
      }

      document.getElementById("age-gate").style.display = "none";
      document.getElementById("main-content").style.display = "block";
    }
  </script>

</body>
</html>
